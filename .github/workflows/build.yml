name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

# 关键修复：赋予 Actions 创建 Release 的写入权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore src/MultiProxy.csproj

      - name: Publish single-file EXE
        shell: pwsh
        run: |
          dotnet publish src/MultiProxy.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=true `
            -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MultiProxy-EXE
          path: publish/MultiProxy.exe
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MultiProxy ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: publish/MultiProxy.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}